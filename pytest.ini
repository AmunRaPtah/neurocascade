[pytest]
markers =
    slow: takes minutes, not seconds (MCMC sampling and similar). Deselected
        from the per-task gate so the autonomous agent can iterate, and run in
        full by the daily `autonomous_runner.py --verify-full` sweep. This is
        a speed classification, NOT a way to park a failing test: a test that
        is slow AND red is still a red test, and the daily sweep will say so.
